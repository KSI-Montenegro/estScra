name: Daily property export

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: Pages per search (coverage is bounded)
        default: '10'
        required: true
      max_listings:
        description: Maximum new listing captures
        default: '300'
        required: true
      max_api_requests:
        description: Bright Data page-request cap; reaching it defers work
        default: '100'
        required: true
      scrape_runtime_seconds:
        description: Listing processing time budget before export/checkpoint
        default: '1200'
        required: true
      photo_runtime_seconds:
        description: Photo processing time budget before publication/checkpoint
        default: '2700'
        required: true
      max_photo_properties:
        description: Maximum queued property galleries to process
        default: '300'
        required: true
      max_photo_images:
        description: Maximum photo downloads/encodes
        default: '1500'
        required: true
      max_clean_images:
        description: Maximum local LaMa edits
        default: '300'
        required: true
      contacts_only:
        description: Update pending contacts and feeds without scraping new ads or processing photos
        type: boolean
        default: false
      max_phone_listings:
        description: Maximum pending listings checked for phones
        default: '300'
        required: true

permissions:
  contents: write

concurrency:
  group: graden-daily-property-scrape
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            daily_scraper/requirements.txt
            daily_scraper/photo-requirements.txt
      - name: Install parsers
        id: install
        run: python -m pip install -r daily_scraper/requirements.txt
      - name: Restore durable state
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p daily_scraper/runtime
          git ls-remote --heads origin refs/heads/daily-scraper-state > "$RUNNER_TEMP/state-ref"
          if [ -s "$RUNNER_TEMP/state-ref" ]; then
            git fetch origin refs/heads/daily-scraper-state:refs/remotes/origin/daily-scraper-state
            git show origin/daily-scraper-state:state.json > daily_scraper/runtime/state.json
            python -c 'import json; json.load(open("daily_scraper/runtime/state.json"))'
            if git cat-file -e origin/daily-scraper-state:photo-state.json 2>/dev/null; then
              git show origin/daily-scraper-state:photo-state.json > daily_scraper/runtime/photo-state.json
              python -c 'import json; json.load(open("daily_scraper/runtime/photo-state.json"))'
            fi
            if git cat-file -e origin/daily-scraper-state:contact-state.json 2>/dev/null; then
              git show origin/daily-scraper-state:contact-state.json > daily_scraper/runtime/contact-state.json
              python -c 'import json; json.load(open("daily_scraper/runtime/contact-state.json"))'
            fi
          fi
      - name: Discover and export
        id: scrape
        if: inputs.contacts_only != true
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ vars.BRIGHTDATA_ZONE || 'esstitor_site_phone_scraper' }}
          BRIGHTDATA_BROWSER_ZONE: ${{ vars.BRIGHTDATA_BROWSER_ZONE || 'estitorscraper2' }}
          MAX_PAGES: ${{ inputs.max_pages || '10' }}
          MAX_LISTINGS: ${{ inputs.max_listings || '300' }}
          MAX_API_REQUESTS: ${{ inputs.max_api_requests || '100' }}
          SCRAPE_RUNTIME_SECONDS: ${{ inputs.scrape_runtime_seconds || '1200' }}
        shell: bash
        run: |
          set -euo pipefail
          scrape_mode=auto
          if [ -z "$BRIGHTDATA_API_KEY" ]; then
            echo 'BRIGHTDATA_API_KEY is not configured; running direct HTTPS only.'
            scrape_mode=direct
          fi
          python daily_scraper/daily_scraper.py --mode "$scrape_mode" --max-pages "$MAX_PAGES" --max-listings "$MAX_LISTINGS" \
            --max-api-requests "$MAX_API_REQUESTS" --max-runtime-seconds "$SCRAPE_RUNTIME_SECONDS"
      - name: Collect listing phone numbers
        id: contacts
        if: always() && !cancelled() && steps.restore.outcome == 'success' && steps.install.outcome == 'success'
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ vars.BRIGHTDATA_ZONE || 'esstitor_site_phone_scraper' }}
          BRIGHTDATA_BROWSER_ZONE: ${{ vars.BRIGHTDATA_BROWSER_ZONE || 'estitorscraper2' }}
          PATULJAK_COOKIE: ${{ secrets.PATULJAK_COOKIE }}
          MAX_PHONE_LISTINGS: ${{ inputs.max_phone_listings || '300' }}
        run: python daily_scraper/contact_enrichment.py --collect --max-listings "$MAX_PHONE_LISTINGS"
      - name: Queue photo inputs independently of listing export
        if: always() && inputs.contacts_only != true && steps.restore.outcome == 'success'
        run: python daily_scraper/photo_queue.py
      - name: Install local photo processing tools
        if: always() && !cancelled() && inputs.contacts_only != true && steps.restore.outcome == 'success' && steps.install.outcome == 'success'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng
          python -m pip install -r daily_scraper/photo-requirements.txt
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.8.0+cpu'
      - name: Cache pinned local LaMa model
        if: always() && !cancelled() && inputs.contacts_only != true && steps.restore.outcome == 'success' && steps.install.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: property_photo_pipeline/models
          key: local-lama-${{ hashFiles('property_photo_pipeline/lama_model.json') }}
      - name: Verify local LaMa model
        if: always() && !cancelled() && inputs.contacts_only != true && steps.restore.outcome == 'success' && steps.install.outcome == 'success'
        run: python property_photo_pipeline/install_local_lama.py
      - name: Detect, clean, optimize and upload property photos
        if: always() && !cancelled() && inputs.contacts_only != true && steps.restore.outcome == 'success' && steps.install.outcome == 'success'
        id: photos
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ vars.BRIGHTDATA_ZONE || 'esstitor_site_phone_scraper' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          BRIGHTDATA_BROWSER_ZONE: ${{ vars.BRIGHTDATA_BROWSER_ZONE || 'estitorscraper2' }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MAX_PHOTO_PROPERTIES: ${{ inputs.max_photo_properties || '300' }}
          MAX_PHOTO_IMAGES: ${{ inputs.max_photo_images || '1500' }}
          MAX_CLEAN_IMAGES: ${{ inputs.max_clean_images || '300' }}
          PHOTO_RUNTIME_SECONDS: ${{ inputs.photo_runtime_seconds || '2700' }}
          OMP_THREAD_LIMIT: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: |
          env -u AWS_PROFILE -u AWS_DEFAULT_PROFILE python daily_scraper/process_photos.py \
            --execute --upload --max-properties "$MAX_PHOTO_PROPERTIES" \
            --max-images "$MAX_PHOTO_IMAGES" --max-clean-images "$MAX_CLEAN_IMAGES" \
            --max-runtime-seconds "$PHOTO_RUNTIME_SECONDS"
      - name: Publish listings with updated contacts
        if: always() && !cancelled() && steps.contacts.outcome == 'success'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python -m pip install 'boto3>=1.35,<2'
          env -u AWS_PROFILE -u AWS_DEFAULT_PROFILE python daily_scraper/contact_enrichment.py --publish
      - name: Save durable state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f daily_scraper/runtime/state.json ] && [ ! -f daily_scraper/runtime/photo-state.json ] && [ ! -f daily_scraper/runtime/contact-state.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_INDEX_FILE="$RUNNER_TEMP/graden-state-index"
          if git rev-parse --verify refs/remotes/origin/daily-scraper-state >/dev/null 2>&1; then
            git read-tree refs/remotes/origin/daily-scraper-state
          else
            git read-tree --empty
          fi
          for state_file in state.json photo-state.json contact-state.json; do
            if [ -f "daily_scraper/runtime/$state_file" ]; then
              python -c 'import json,sys; json.load(open(sys.argv[1]))' "daily_scraper/runtime/$state_file"
              state_blob=$(git hash-object -w "daily_scraper/runtime/$state_file")
              git update-index --add --cacheinfo "100644,$state_blob,$state_file"
            fi
          done
          state_tree=$(git write-tree)
          if git rev-parse --verify refs/remotes/origin/daily-scraper-state >/dev/null 2>&1; then
            state_parent=$(git rev-parse refs/remotes/origin/daily-scraper-state)
            state_commit=$(git commit-tree "$state_tree" -p "$state_parent" -m 'Update daily scraper state')
          else
            state_commit=$(git commit-tree "$state_tree" -m 'Initialize daily scraper state')
          fi
          git push origin "$state_commit:refs/heads/daily-scraper-state"
      - name: Attach daily files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            daily_scraper/exports/
            daily_scraper/photo_exports/
            daily_scraper/contact_exports/
            !daily_scraper/photo_exports/ready/**
            !daily_scraper/photo_exports/repairs/**
          if-no-files-found: warn
          retention-days: 30
      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('daily_scraper/exports/latest.json')
          if path.exists():
              d = json.loads(path.read_text())['summary']
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('Daily export: ' + d['status'] + '\n\n')
                  for k in ('captured_listings', 'pending_backlog', 'errors', 'warnings', 'deferred_by_request_limit', 'limits_reached', 'by_source', 'requests'):
                      f.write(f'- {k}: {d.get(k)}\n')
                  if d.get('warnings'):
                      print('::warning::Some source listings need retry or are unavailable; see warnings.json and the run summary.')
                  f.write('\nDownload the property-export artifact below. Search coverage is bounded.\n')
          contacts = Path('daily_scraper/contact_exports/summary.json')
          if contacts.exists():
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  d = json.loads(contacts.read_text())
                  f.write('\nContact collection\n\n')
                  for k in ('total_listings', 'with_phone', 'with_single_phone', 'by_status', 'errors'):
                      f.write(f'- {k}: {d.get(k)}\n')
                  f.write('\nLatest cumulative listing feed: https://pub-f3c0e65ac46b487d83f5dfb93b1c90b8.r2.dev/graden-imports/listings/latest.json\n')
          photos = Path('daily_scraper/photo_exports/summary.json')
          if photos.exists():
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('\nPhoto processing\n\n```json\n' + photos.read_text() + '\n```\n')
          PY
